# Tika server for document parsing (PDF, DOCX → plain text)
# Supabase runs separately via: npx supabase start
services:
  tika:
    image: apache/tika:latest
    container_name: skill-dna-tika
    ports:
      - "9998:9998"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 3
